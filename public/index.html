<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Schedule Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='3' width='14' height='2' rx='1' fill='%23FFB454'/%3E%3Crect x='1' y='7' width='9' height='2' rx='1' fill='%235CC8FF'/%3E%3Crect x='1' y='11' width='12' height='2' rx='1' fill='%235CFFB4'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/app.css" />
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="dot" id="connDot"></span>
      <b>SCHEDULE LAB</b><span class="tag" id="appVersion"></span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="spacer"></div>
    <span class="pill" id="connText" title="">connecting…</span>
    <button class="btn ghost small" id="btnExport" title="Save all Schedule Lab data (sorts, channel setup, history) to a file">Export</button>
    <button class="btn ghost small" id="btnImport" title="Load a Schedule Lab export file">Import</button>
    <input type="file" id="importInput" accept="application/json" hidden />
  </header>
  <div class="banner" id="banner" hidden></div>
  <main class="main" id="main"></main>
</div>
<div class="toasts" id="toasts"></div>
<div class="modal-backdrop" id="modal"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
